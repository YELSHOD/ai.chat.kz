spring.application.name=ai.chat.kz
spring.config.import=optional:file:.env[.properties],optional:file:.env.example[.properties]
app.security.disable-auth=${APP_SECURITY_DISABLE_AUTH:true}
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai.chat.kz}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com}
ai.api-key=${AI_API_KEY:${GEMINI_API_KEY:}}
ai.model=${AI_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}
ai.temperature=${AI_TEMPERATURE:${GEMINI_TEMPERATURE:0.7}}

ai.gemini.api-key=${ai.api-key}
ai.gemini.model=${ai.model}
ai.gemini.temperature=${ai.temperature}
ai.context.max-messages=${AI_CONTEXT_MAX_MESSAGES:30}
ai.context.max-chars=${AI_CONTEXT_MAX_CHARS:12000}

security.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:10080}
app.auth.oauth2.redirect-success-uri=${APP_AUTH_OAUTH2_REDIRECT_SUCCESS_URI:http://localhost:5173/auth/callback}
app.auth.password-reset.ttl-minutes=${APP_AUTH_PASSWORD_RESET_TTL_MINUTES:30}
app.auth.password-reset.expose-token=${APP_AUTH_PASSWORD_RESET_EXPOSE_TOKEN:false}
app.auth.email-verification.ttl-minutes=${APP_AUTH_EMAIL_VERIFICATION_TTL_MINUTES:1440}
app.auth.email-verification.expose-token=${APP_AUTH_EMAIL_VERIFICATION_EXPOSE_TOKEN:false}
app.auth.email-verification.confirm-url=${APP_AUTH_EMAIL_VERIFICATION_CONFIRM_URL:http://localhost:5173/verify-email}
app.mail.from=${APP_MAIL_FROM:no-reply@ai.chat.kz}
